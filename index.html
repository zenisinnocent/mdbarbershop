<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Barber Shop | Premium Grooming</title>
<meta name="description" content="MD Barber Shop offers premium haircuts, skin fades, beard trims, hot towel shaves and grooming products. Open 10am to 2am. Book your appointment today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #c8a45d;
  --black: #101010;
  --dark: #1b1b1b;
  --muted: #aaa;
  --border: #333;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  background: var(--black);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  line-height: 1.6;
}

img {
  max-width: 100%;
  display: block;
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

header {
  min-height: 85px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 15px 8%;
  position: sticky;
  top: 0;
  background: rgba(16, 16, 16, 0.95);
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 30px;
  letter-spacing: 3px;
  text-decoration: none;
}

nav {
  display: flex;
  align-items: center;
  gap: 10px;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 10px 12px;
  font-size: 13px;
  letter-spacing: 1px;
  transition: color 0.3s ease;
}

nav a:hover,
nav a:focus-visible {
  color: var(--gold);
}

.cart-button {
  position: relative;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 10px 16px;
  font: 700 12px 'DM Sans', sans-serif;
  letter-spacing: 1px;
  cursor: pointer;
  transition: 0.3s;
}

.cart-button:hover {
  background: var(--gold);
  color: #111;
}

.cart-count {
  position: absolute;
  top: -8px;
  right: -8px;
  min-width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  background: var(--gold);
  color: #111;
  border-radius: 50%;
  font-size: 11px;
}

.hero {
  min-height: 90vh;
  display: flex;
  align-items: center;
  padding: 8%;
  background:
    linear-gradient(90deg, #101010 10%, rgba(16, 16, 16, 0.6)),
    url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1600&q=80')
    center/cover no-repeat;
}
